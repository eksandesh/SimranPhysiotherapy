<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  [class]="className"
  [ngSwitch]="name"
>
  <!-- LayoutDashboard -->
  <ng-container *ngSwitchCase="'LayoutDashboard'">
    <rect width="7" height="9" x="3" y="3" rx="1" />
    <rect width="7" height="5" x="14" y="3" rx="1" />
    <rect width="7" height="9" x="14" y="12" rx="1" />
    <rect width="7" height="5" x="3" y="16" rx="1" />
  </ng-container>

  <!-- UsersRound -->
  <ng-container *ngSwitchCase="'UsersRound'">
    <path d="M18 21a8 8 0 0 0-16 0" />
    <circle cx="10" cy="8" r="5" />
    <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
  </ng-container>

  <!-- CalendarDays -->
  <ng-container *ngSwitchCase="'CalendarDays'">
    <rect width="18" height="18" x="3" y="4" rx="2" />
    <line x1="16" x2="16" y1="2" y2="6" />
    <line x1="8" x2="8" y1="2" y2="6" />
    <line x1="3" x2="21" y1="10" y2="10" />
    <path d="M8 14h.01" />
    <path d="M12 14h.01" />
    <path d="M16 14h.01" />
    <path d="M8 18h.01" />
    <path d="M12 18h.01" />
    <path d="M16 18h.01" />
  </ng-container>

  <!-- FileBarChart -->
  <ng-container *ngSwitchCase="'FileBarChart'">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
    <path d="M14 2v4a2 2 0 0 0 2 2h4" />
    <path d="M8 18v-2" />
    <path d="M12 18v-4" />
    <path d="M16 18v-6" />
  </ng-container>

  <!-- DatabaseBackup -->
  <ng-container *ngSwitchCase="'DatabaseBackup'">
    <ellipse cx="12" cy="5" rx="9" ry="3" />
    <path d="M3 12a9 3 0 0 0 5 2.69" />
    <path d="M21 9.3V5" />
    <path d="M3 5v14a9 3 0 0 0 6.47 2.88" />
    <path d="M12 12v4h4" />
    <path d="M13 20a5 5 0 0 0 9-3 4.5 4.5 0 0 0-4.5-4.5c-1.33 0-2.54.54-3.41 1.41L12 16" />
  </ng-container>

  <!-- PanelLeft -->
  <ng-container *ngSwitchCase="'PanelLeft'">
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="M9 3v18" />
  </ng-container>

  <!-- Menu -->
  <ng-container *ngSwitchCase="'Menu'">
    <line x1="4" x2="20" y1="12" y2="12" />
    <line x1="4" x2="20" y1="6" y2="6" />
    <line x1="4" x2="20" y1="18" y2="18" />
  </ng-container>

  <!-- ChevronRight -->
  <ng-container *ngSwitchCase="'ChevronRight'">
    <path d="m9 18 6-6-6-6" />
  </ng-container>

  <!-- Plus -->
  <ng-container *ngSwitchCase="'Plus'">
    <path d="M5 12h14" />
    <path d="M12 5v14" />
  </ng-container>

  <!-- Search -->
  <ng-container *ngSwitchCase="'Search'">
    <circle cx="11" cy="11" r="8" />
    <path d="m21 21-4.3-4.3" />
  </ng-container>

  <!-- Download -->
  <ng-container *ngSwitchCase="'Download'">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
    <polyline points="7 10 12 15 17 10" />
    <line x1="12" x2="12" y1="15" y2="3" />
  </ng-container>

  <!-- Upload -->
  <ng-container *ngSwitchCase="'Upload'">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
    <polyline points="17 8 12 3 7 8" />
    <line x1="12" x2="12" y1="3" y2="15" />
  </ng-container>

  <!-- HardDrive -->
  <ng-container *ngSwitchCase="'HardDrive'">
    <line x1="22" x2="2" y1="12" y2="12" />
    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
    <line x1="6" x2="6.01" y1="16" y2="16" />
    <line x1="10" x2="10.01" y1="16" y2="16" />
  </ng-container>

  <!-- ShieldCheck -->
  <ng-container *ngSwitchCase="'ShieldCheck'">
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
    <path d="m9 12 2 2 4-4" />
  </ng-container>

  <!-- Stethoscope -->
  <ng-container *ngSwitchCase="'Stethoscope'">
    <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" />
    <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4" />
    <circle cx="20" cy="10" r="2" />
  </ng-container>

  <!-- FileText -->
  <ng-container *ngSwitchCase="'FileText'">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
    <path d="M14 2v4a2 2 0 0 0 2 2h4" />
    <path d="M10 9H8" />
    <path d="M16 13H8" />
    <path d="M16 17H8" />
  </ng-container>

  <!-- Package -->
  <ng-container *ngSwitchCase="'Package'">
    <path d="m7.5 4.27 9 5.15" />
    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
    <path d="m3.3 7 8.7 5 8.7-5" />
    <path d="M12 22V12" />
  </ng-container>

  <!-- IndianRupee -->
  <ng-container *ngSwitchCase="'IndianRupee'">
    <path d="M6 3h12" />
    <path d="M6 8h12" />
    <path d="m6 13 8.5 8" />
    <path d="M6 13h3" />
    <path d="M9 13c6.667 0 6.667-10 0-10" />
  </ng-container>

  <!-- LogOut -->
  <ng-container *ngSwitchCase="'LogOut'">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
    <polyline points="16 17 21 12 16 7" />
    <line x1="21" x2="9" y1="12" y2="12" />
  </ng-container>

  <!-- CheckCircle2 -->
  <ng-container *ngSwitchCase="'CheckCircle2'">
    <circle cx="12" cy="12" r="10" />
    <path d="m9 12 2 2 4-4" />
  </ng-container>

  <!-- Activity -->
  <ng-container *ngSwitchCase="'Activity'">
    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
  </ng-container>

  <!-- ArrowRight -->
  <ng-container *ngSwitchCase="'ArrowRight'">
    <path d="M5 12h14" />
    <path d="m12 5 7 7-7 7" />
  </ng-container>

  <!-- CalendarCheck -->
  <ng-container *ngSwitchCase="'CalendarCheck'">
    <rect width="18" height="18" x="3" y="4" rx="2" />
    <line x1="16" x2="16" y1="2" y2="6" />
    <line x1="8" x2="8" y1="2" y2="6" />
    <line x1="3" x2="21" y1="10" y2="10" />
    <path d="m9 16 2 2 4-4" />
  </ng-container>

  <!-- ClipboardCheck -->
  <ng-container *ngSwitchCase="'ClipboardCheck'">
    <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
    <path d="m9 14 2 2 4-4" />
  </ng-container>

  <!-- FileDown -->
  <ng-container *ngSwitchCase="'FileDown'">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
    <path d="M14 2v4a2 2 0 0 0 2 2h4" />
    <path d="M12 18v-6" />
    <path d="m9 15 3 3 3-3" />
  </ng-container>

  <!-- UserRoundPlus -->
  <ng-container *ngSwitchCase="'UserRoundPlus'">
    <path d="M2 21a8 8 0 0 1 13.292-6" />
    <circle cx="10" cy="8" r="5" />
    <path d="M19 16v6" />
    <path d="M22 19h-6" />
  </ng-container>

  <!-- Wallet -->
  <ng-container *ngSwitchCase="'Wallet'">
    <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
    <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
  </ng-container>

  <!-- AlertCircle -->
  <ng-container *ngSwitchCase="'AlertCircle'">
    <circle cx="12" cy="12" r="10" />
    <line x1="12" x2="12" y1="8" y2="12" />
    <line x1="12" x2="12.01" y1="16" y2="16" />
  </ng-container>

  <!-- Hourglass -->
  <ng-container *ngSwitchCase="'Hourglass'">
    <path d="M5 22h14" />
    <path d="M5 2h14" />
    <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" />
    <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
  </ng-container>

  <!-- ArrowUpRight -->
  <ng-container *ngSwitchCase="'ArrowUpRight'">
    <path d="M7 7h10v10" />
    <path d="M7 17 17 7" />
  </ng-container>

  <!-- Trash2 -->
  <ng-container *ngSwitchCase="'Trash2'">
    <path d="M3 6h18" />
    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
    <line x1="10" x2="10" y1="11" y2="17" />
    <line x1="14" x2="14" y1="11" y2="17" />
  </ng-container>

  <!-- Printer -->
  <ng-container *ngSwitchCase="'Printer'">
    <polyline points="6 9 6 2 18 2 18 9" />
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
    <rect width="12" height="8" x="6" y="14" />
  </ng-container>

  <!-- Eye -->
  <ng-container *ngSwitchCase="'Eye'">
    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
    <circle cx="12" cy="12" r="3" />
  </ng-container>

  <!-- EyeOff -->
  <ng-container *ngSwitchCase="'EyeOff'">
    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
    <line x1="2" x2="22" y1="2" y2="22" />
  </ng-container>

  <!-- LogIn -->
  <ng-container *ngSwitchCase="'LogIn'">
    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
    <polyline points="10 17 15 12 10 7" />
    <line x1="15" x2="3" y1="12" y2="12" />
  </ng-container>

  <!-- X -->
  <ng-container *ngSwitchCase="'X'">
    <path d="M18 6 6 18" />
    <path d="m6 6 12 12" />
  </ng-container>
</svg>
